<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 0; background: #1a1a1a; display: flex; justify-content: center; }
  .slide-box { width: 1080px; height: 1350px; position: relative; overflow: hidden; }
  .bg-img { width: 1080px; height: 1350px; object-fit: cover; }
  
  .header-patch-s1 {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 275px;
    background: radial-gradient(circle at 50% 30%, #FAF6F0 0%, #F1E9DA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 12px;
    z-index: 10;
  }

  .top-left-brand-name {
    position: absolute;
    top: 42px;
    left: 55px;
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 700;
    color: #9B7B3B;
    letter-spacing: 0.22em;
    z-index: 25;
  }

  .top-right-logo-box {
    position: absolute;
    top: 35px;
    right: 55px;
    width: 90px;
    height: 90px;
    background: #FAF6F0;
    border: 2px solid #C29B53;
    padding: 6px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(61, 82, 57, 0.12);
    z-index: 25;
  }
  .top-right-logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .main-heading-s1 {
    font-family: 'Playfair Display', serif;
    font-size: 58px;
    font-weight: 700;
    color: #2C3E2B;
    text-align: center;
    line-height: 1.15;
    max-width: 820px;
    margin-bottom: 8px;
  }
  .sub-caption-s1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: #4A5548;
    text-align: center;
  }
</style>
</head>
<body>
<div class="slide-box" id="slide-1-box">
  <div class="top-left-brand-name">AYUNILAYAM</div>
  <div class="top-right-logo-box">
    <img src="file:///Users/raghibnasri/Documents/Projects/ayunilayam_ad/logo.jpeg" alt="Logo">
  </div>
  <img src="file:///Users/raghibnasri/Documents/Projects/ayunilayam_ad/extracted_ref/slide_1_ref.png" class="bg-img">
  <div class="header-patch-s1">
    <div class="main-heading-s1">
      Is Your Spine Trying to<br>Tell You Something?
    </div>
    <div class="sub-caption-s1">
      Don’t ignore the signs your body is showing. Early care makes all the difference.
    </div>
  </div>
</div>
</body>
</html>
